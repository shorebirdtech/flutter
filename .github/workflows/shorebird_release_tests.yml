name: shorebird_release_tests

# Upstream's tool and build suites, run by a release on the commit it ships:
# _build_engine release_flutter's gate dispatches this on the release
# candidate's branch (release.yaml coverage:, key flutter_sha) and requires a
# green run at that commit. Each job is one of upstream's Linux .ci.yaml
# targets, run the way upstream's flutter_drone recipe runs it: SHARD and
# SUBSHARD into dev/bots/test.dart. The upstream suites a release doesn't
# run (framework_tests, tool integration, customer_testing, devicelab) are
# listed with why in release.yaml's not_run.
#
# Everything runs on what the commit ships: bin/flutter downloads the Dart SDK
# and engine artifacts for bin/internal/engine.version from
# download.shorebird.dev, and test.dart runs on that Dart. It never installs
# another Dart.
#
# Not run on every PR (shorebird_ci.yml runs tool_tests general there). A PR
# that changes this file runs it, so a change to it is tried before it lands.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/shorebird_release_tests.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.shard }}${{ matrix.subshard && format(' {0}', matrix.subshard) || '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux tool_tests_general and tool_tests_commands.
          - { shard: tool_tests, subshard: general }
          - { shard: tool_tests_commands, subshard: 1_1 }
          # Linux build_tests_N_5: flutter build of the examples and
          # integration apps, debug and release.
          - { shard: build_tests, subshard: 1_5 }
          - { shard: build_tests, subshard: 2_5 }
          - { shard: build_tests, subshard: 3_5 }
          - { shard: build_tests, subshard: 4_5 }
          - { shard: build_tests, subshard: 5_5 }
          # Linux analyze.
          - { shard: analyze }

    env:
      SHARD: ${{ matrix.shard }}
      SUBSHARD: ${{ matrix.subshard }}
      # Upstream's bots set this; the tool skips its analytics and
      # first-run messages.
      BOT: "true"
      FLUTTER_SUPPRESS_ANALYTICS: "true"

    steps:
      - name: 📚 Git Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The tool reads its version from tags.
          fetch-depth: 0

      # Upstream's dependencies for these targets: open_jdk 21 and the
      # Android SDK (on the image), clang, cmake, ninja and GTK for Linux
      # desktop builds, ktlint for analyze.
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: "zulu"
          java-version: "21"

      - name: 📦 Linux desktop build dependencies
        if: matrix.shard != 'analyze'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libupower-glib-dev liblzma-dev libstdc++-12-dev

      # Upstream's android_sdk package carries the NDK the Flutter Gradle
      # plugin asks for (ndkVersion in FlutterExtension.kt); without it every
      # app build in the shard downloads the NDK itself.
      - name: 📦 Android NDK
        if: matrix.shard == 'build_tests'
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358" > /dev/null

      - name: 📦 ktlint
        if: matrix.shard == 'analyze'
        run: |
          sudo curl -sSLo /usr/local/bin/ktlint https://github.com/pinterest/ktlint/releases/download/1.5.0/ktlint
          sudo chmod +x /usr/local/bin/ktlint

      - name: 🐦 Flutter (Dart SDK and engine artifacts for engine.version)
        run: |
          bin/flutter config --no-analytics
          bin/flutter --version
          echo "$GITHUB_WORKSPACE/bin" >> "$GITHUB_PATH"

      - name: 🧪 dev/bots/test.dart
        run: |
          bin/flutter pub get -C dev/bots
          bin/cache/dart-sdk/bin/dart dev/bots/test.dart
