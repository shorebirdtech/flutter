name: shorebird_http_client

# The updater's HTTP client (engine/src/flutter/shell/common/shorebird/
# http_*.cc), built on its own: the TLS accept/reject table on each desktop
# OS must match dart:io's on the same runner, and the parser is fuzzed
# under ASan/UBSan, including against llhttp.
#
# The table that gates is served from localhost by tls_test_server, with its
# test root added to the OS's trusted roots. The same table against
# badssl.com runs after it and only warns: those hosts change and flake.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - ".github/workflows/shorebird_http_client.yml"
      - "engine/src/flutter/shell/common/shorebird/**"
      - "engine/src/flutter/fml/log*"
  push:
    branches:
      - shorebird/dev
    paths:
      - ".github/workflows/shorebird_http_client.yml"
      - "engine/src/flutter/shell/common/shorebird/**"
      - "engine/src/flutter/fml/log*"

jobs:
  tls-table:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    name: 🔒 TLS table vs dart:io (${{ matrix.os }})

    defaults:
      run:
        shell: bash

    steps:
      - name: 📚 Git Checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            DEPS
            engine/src/flutter/shell/common/shorebird
            engine/src/flutter/fml

      - name: 🔐 Fetch BoringSSL at the engine's revision
        run: |
          rev=$(sed -n "s/.*'dart_boringssl_rev': '\([0-9a-f]*\)'.*/\1/p" DEPS)
          git init -q boringssl
          git -C boringssl fetch -q --depth 1 \
            https://boringssl.googlesource.com/boringssl "$rev"
          git -C boringssl checkout -q FETCH_HEAD

      - name: 🛠️ Build shorebird_http_probe and tls_test_server
        run: |
          cmake -S engine/src/flutter/shell/common/shorebird/standalone \
            -B out -DBORINGSSL_DIR="$PWD/boringssl" \
            -DCMAKE_BUILD_TYPE=Release -DOPENSSL_NO_ASM=1
          cmake --build out --config Release \
            --target shorebird_http_probe tls_test_server

      - name: 🎯 Setup Dart
        uses: dart-lang/setup-dart@v1

      - name: 🔒 Compare with dart:io on local test hosts
        run: |
          dir=engine/src/flutter/shell/common/shorebird
          probe=$(find out -name 'shorebird_http_probe' -o -name 'shorebird_http_probe.exe' | head -1)
          server=$(find out -name 'tls_test_server' -o -name 'tls_test_server.exe' | head -1)
          mkdir tls
          # Exits non-zero if a case fails its own self-check.
          "$server" tls > /dev/null &
          pid=$!
          trap "kill $pid" EXIT
          for i in $(seq 300); do
            [ -s tls/cases.tsv ] && break
            kill -0 $pid || { wait $pid; exit 1; }
            sleep 1
          done
          [ -s tls/cases.tsv ]
          case "$RUNNER_OS" in
            Linux)
              sudo cp tls/root.pem /usr/local/share/ca-certificates/shorebird-tls-table.crt
              sudo update-ca-certificates ;;
            macOS)
              sudo security add-trusted-cert -d -r trustRoot \
                -k /Library/Keychains/System.keychain tls/root.pem ;;
            Windows)
              certutil -addstore -f Root "$(cygpath -w tls/root.pem)" ;;
          esac
          tr -d '\r' < tls/cases.tsv > cases.tsv
          urls=$(cut -f2 cases.tsv)
          "$probe" $urls | tr -d '\r' | cut -f2 > cpp.txt
          dart $dir/http_probe.dart $urls | tr -d '\r' | cut -f2 > dart.txt
          # Each case: our result must equal dart:io's, and accept, or
          # reject at the TLS layer, as the case expects ("any": no
          # expectation).
          paste cases.tsv cpp.txt dart.txt | awk -F'\t' '
            { ok = $4 == $5 && ($3 == "any" ||
                   ($3 == "accept" && $4 == "accept") ||
                   ($3 == "reject" && $4 == "tls"))
              printf "%-21s %-7s %-10s %-10s %s\n", $1, $3, $4, $5,
                     ok ? "" : "FAIL"
              if (!ok) failed = 1 }
            BEGIN { printf "%-21s %-7s %-10s %-10s\n", "case", "expect",
                           "updater", "dart:io" }
            END { exit failed }'

      - name: 🌐 Reach Shorebird's hosts
        run: |
          probe=$(find out -name 'shorebird_http_probe' -o -name 'shorebird_http_probe.exe' | head -1)
          "$probe" https://api.shorebird.dev/ https://cdn.shorebird.cloud/ \
            https://storage.googleapis.com/ https://download.shorebird.dev/ \
            | tr -d '\r' | cut -f1,2 | tee hosts.tsv
          if grep -v '	accept$' hosts.tsv; then exit 1; fi

      # Doesn't fail the job: badssl.com is a third party and its hosts flake.
      # Differences show as warnings on the run.
      - name: 🌍 Compare with dart:io on badssl.com
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 10
        run: |
          dir=engine/src/flutter/shell/common/shorebird
          probe=$(find out -name 'shorebird_http_probe' -o -name 'shorebird_http_probe.exe' | head -1)
          urls=$(tr -d '\r' < $dir/tls_matrix_urls.txt)
          "$probe" $urls | tr -d '\r' | cut -f1,2 > cpp.tsv
          dart $dir/http_probe.dart $urls | tr -d '\r' | cut -f1,2 > dart.tsv
          paste dart.tsv cpp.tsv | awk -F'\t' '
            $2 != $4 { printf "::warning::%s: dart:io %s, updater %s\n",
                              $1, $2, $4 }
            { print $1, $4 }'

  fuzz:
    runs-on: ubuntu-latest

    name: 🐛 Fuzz the HTTP parser

    steps:
      - name: 📚 Git Checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            engine/src/flutter/shell/common/shorebird

      - name: 🐛 Fuzz for 5 minutes per target
        run: CXX=clang++ engine/src/flutter/shell/common/shorebird/fuzz/run.sh 300

      - name: 📦 Upload crashing inputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes
          path: engine/src/flutter/shell/common/shorebird/fuzz/out/*crash*
