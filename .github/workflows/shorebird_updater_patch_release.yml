# Builds the updater's `patch` CLI (engine/src/flutter/third_party/updater/patch)
# for each host the shorebird CLI runs on and publishes it as a GitHub release
# on patch-v* tags. _build_engine's finalize mirrors these releases to the
# engine's download bucket, where the shorebird CLI fetches them.
name: shorebird_updater_patch_release

permissions:
  contents: write

on:
  push:
    tags:
      - "patch-v*"

jobs:
  create-draft:
    runs-on: ubuntu-latest
    name: 📝 Create Draft Release
    steps:
      # A draft first, so the upload jobs below attach to one release
      # instead of racing to create it. Not --latest: these must never be
      # this repo's "latest" release.
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 ||
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft \
              --verify-tag --latest=false --title "patch ${TAG#patch-v}" \
              --notes "The updater's patch CLI, built from engine/src/flutter/third_party/updater/patch."

  upload-artifacts:
    needs: create-draft
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - os: windows-latest

    runs-on: ${{ matrix.os }}

    name: 🦀 Upload Artifacts

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: taiki-e/upload-rust-binary-action@f0d45ae91ee7b8ee928de7a9d04d893a08bcbec6 # v1.30.2
        with:
          bin: "patch"
          manifest-path: engine/src/flutter/third_party/updater/Cargo.toml
          target: ${{ matrix.target }}
          tar: none
          zip: all
          token: ${{ secrets.GITHUB_TOKEN }}

  publish:
    needs: upload-artifacts
    runs-on: ubuntu-latest
    name: 🚀 Publish Release
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          count=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
            --json assets --jq '[.assets[].name | select(endswith(".zip"))] | length')
          if [ "$count" != 4 ]; then
            echo "Expected 4 zips on the draft, found $count" >&2
            exit 1
          fi
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest=false
