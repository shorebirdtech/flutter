name: sync_upstream_tags

# Mirrors flutter/flutter tags into this repo once a day so our tags don't
# drift from upstream's. Tags only; branches are never touched.
#
# Mirroring runs on a GitHub App token, not GITHUB_TOKEN. GitHub refuses any
# ref write whose commits touch .github/workflows/ unless the writer holds the
# `workflows` permission, and GITHUB_TOKEN cannot hold it -- there is no such
# permissions: key. Upstream tags carry workflow changes routinely, so
# GITHUB_TOKEN cannot mirror them at all. The REST refs API is subject to the
# same check and returns 403 there, so it is not a way around the permission,
# only a way around cloning: it uploads no objects, because this repo is a fork
# of flutter/flutter and shares its object store, so every upstream sha already
# resolves here.
#
# A tag that exists here at a different sha than upstream is reported and fails
# the run rather than being overwritten: that means someone hand-tagged this
# repo and a person has to look. Tags upstream deletes are left in place.
#
# GITHUB_TOKEN never triggers other workflows, so mirrored tags don't start CI.

on:
  schedule:
    - cron: "17 6 * * *" # daily, 06:17 UTC
  workflow_dispatch:

# Every write goes through the app token below, so the job token needs nothing.
permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    if: github.repository == 'shorebirdtech/flutter'
    defaults:
      run:
        shell: bash

    steps:
      - name: 🔑 Mint an app token
        id: app_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.TAG_SYNC_APP_ID }}
          private-key: ${{ secrets.TAG_SYNC_APP_PRIVATE_KEY }}

      - name: 🔍 Diff our tags against upstream's
        run: |
          set -euo pipefail
          # ls-remote keeps this off a multi-gigabyte clone of flutter. Peeled
          # "^{}" lines are dropped so an annotated tag mirrors as its tag
          # object, which is what upstream's ref points at.
          tags() {
            git ls-remote --tags "$1" \
              | grep -v '\^{}$' \
              | sed -E 's|^([0-9a-f]+)[[:space:]]+refs/tags/|\1 |'
          }
          tags https://github.com/flutter/flutter.git > upstream.txt
          tags "https://github.com/$GITHUB_REPOSITORY.git" > ours.txt

          : > missing.txt
          : > conflicts.txt
          awk '
            NR == FNR    { ours[$2] = $1; next }
            !($2 in ours) { print $2, $1 > "missing.txt"; next }
            ours[$2] != $1 { print $2, $1, ours[$2] > "conflicts.txt" }
          ' ours.txt upstream.txt

      - name: ⬆️ Create missing tags
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
        run: |
          set -euo pipefail
          : > created.md
          while read -r name sha; do
            gh api --silent -X POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f "ref=refs/tags/$name" -f "sha=$sha"
            echo "- \`$name\` -> \`$sha\`" >> created.md
          done < missing.txt

      - name: 📝 Summarize
        if: always()
        run: |
          {
            echo "### Mirrored $(wc -l < missing.txt) new tag(s)"
            cat created.md 2>/dev/null || true
            if [[ -s conflicts.txt ]]; then
              printf '\n### Tags here at a different sha than upstream\n\n'
              echo "| tag | upstream | here |"
              echo "|---|---|---|"
              awk '{ printf "| `%s` | `%s` | `%s` |\n", $1, $2, $3 }' conflicts.txt
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 🚨 Fail on divergent tags
        run: test ! -s conflicts.txt
