name: shorebird_android_engine_tests

# The Android engine suites upstream runs on every engine change, which
# Shorebird's release didn't run until now:
#   - Robolectric: the Android embedding's Java tests (upstream's linux_unopt
#     builder, ci/builders/linux_unopt.json "ci/android_debug_unopt").
#   - flutter_shell_native_unittests (the Android shell's C++ tests) on an
#     x86_64 emulator (upstream's linux_android_emulator builder,
#     ci/builders/linux_android_emulator.json). That builder also runs the
#     Impeller Android/Vulkan unittests; they aren't here because we don't
#     change graphics code (Eric 2026-11-03, arc step 7659).
#
# A release runs this by workflow_dispatch at the engine commit it ships
# (_build_engine release_flutter/release.yaml `coverage:`, key engine_sha),
# and reuses a green run at that commit from an earlier rc. It doesn't run on
# every engine PR: that would add two Android builds to each one. It runs on
# PRs that change this file, so a change to it is tested before it lands.
#
# The sync mirrors shorebird_engine_tests.yml, with the Android deps (SDK,
# NDK, JDK, gradle) on. The cache volume has its own tag, so PR code can't
# plant anything a release build later runs.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/shorebird_android_engine_tests.yml

permissions:
  contents: read

jobs:
  android-engine-tests:
    name: ${{ matrix.name }}
    # Fork PRs get no secrets (the sync needs the dart-sdk deploy key) and
    # must not run on our Namespace runners.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on:
      - nscloud-ubuntu-22.04-amd64-16x64-with-cache
      - nscloud-cache-tag-shorebird-android-engine-tests
      - nscloud-cache-size-150gb
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          # Upstream's gn args, without RBE.
          - name: Robolectric (android_debug_unopt)
            suite: java
            gn_args: --android --unoptimized
            out_dir: android_debug_unopt
            rust_target: armv7-linux-androideabi
            targets: flutter/shell/platform/android:robolectric_tests
          - name: Native tests on x86_64 emulator (android_debug_x64)
            suite: android
            gn_args: --android --android-cpu=x64 --no-lto
            out_dir: android_debug_x64
            rust_target: x86_64-linux-android
            targets: flutter/shell/platform/android:flutter_shell_native_unittests

    steps:
      - name: 📚 Git Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: 📦 Setup namespace cache
        uses: namespacelabs/nscloud-cache-action@1124a6f3ce44e5cf84cc22111530961f4d2a15f9 # v1.7.0
        with:
          path: |
            ~/git_cache
            ~/depot_tools
            ~/cipd_cache

      # CIPD_CACHE_DIR must be absolute; ~ doesn't expand in `env:`.
      - name: 📦 Configure CIPD cache
        run: |
          mkdir -p "$HOME/cipd_cache"
          echo "CIPD_CACHE_DIR=$HOME/cipd_cache" >> "$GITHUB_ENV"

      - name: 🐍 Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11.8"

      # build_rust_updater.py builds the updater with cargo for the target.
      # Pinned to the toolchain the release build ships with
      # (_build_engine shard-build.yaml).
      - name: 🦀 Setup Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-16
        with:
          toolchain: 1.99.1
          targets: ${{ matrix.rust_target }},x86_64-unknown-linux-gnu

      # DEPS pulls shorebirdtech/dart-sdk (private) over SSH.
      - name: 🔑 Setup SSH
        uses: webfactory/ssh-agent@e83874834305fe9a4a2997156cb26c5de65a8555 # v0.10.0
        with:
          ssh-private-key: ${{ secrets.DART_SDK_DEPLOY_KEY }}

      - name: 🧰 Setup depot_tools
        run: |
          if [[ ! -d "$HOME/depot_tools/.git" ]]; then
            git clone https://chromium.googlesource.com/chromium/tools/depot_tools.git "$HOME/depot_tools"
          else
            cd "$HOME/depot_tools"
            git checkout main 2>/dev/null || git checkout -b main origin/main
            git pull --quiet
          fi
          echo "$HOME/depot_tools" >> "$GITHUB_PATH"

      # Unmanaged solution rooted at this checkout, so gclient syncs the DEPS
      # of the commit under test and leaves the checkout itself alone.
      - name: ⚙️ Setup gclient config
        run: |
          cat > .gclient << EOF
          solutions = [
            {
              "managed": False,
              "name": ".",
              "url": "git@github.com:shorebirdtech/flutter.git",
              "custom_deps": {},
              "deps_file": "DEPS",
              "safesync_url": "",
            },
          ]
          custom_vars = {
            "download_android_deps": True,
            "download_fuchsia_deps": False,
          }
          cache_dir = "$HOME/git_cache"
          EOF

      - name: 🔄 Sync engine dependencies (gclient)
        run: gclient sync --delete_unversioned_trees --with_tags

      # Only the sync needs the deploy key; drop it before running PR code.
      - name: 🔑 Remove deploy key
        run: ssh-add -D

      # --no-prebuilt-dart-sdk: build with our Dart fork, as
      # shorebird_engine_tests.yml does.
      - name: ⚙️ Generate build files (gn)
        run: ./flutter/tools/gn ${{ matrix.gn_args }} --no-prebuilt-dart-sdk --no-rbe
        working-directory: engine/src

      - name: 🔨 Build
        run: ninja -C out/${{ matrix.out_dir }} ${{ matrix.targets }}
        working-directory: engine/src

      # run_tests.py --type java runs gradle in
      # shell/platform/android/test_runner with the engine's own SDK and JDK.
      - name: 🧪 Run Robolectric tests
        if: matrix.suite == 'java'
        run: python3 flutter/testing/run_tests.py --variant ${{ matrix.out_dir }} --type java --android-variant ${{ matrix.out_dir }}
        working-directory: engine/src

      # Upstream runs this on an API 36 google_apis x86_64 AVD. KVM is
      # available on Namespace's Linux runners. As run_tests.py --type
      # android does for each binary: push it over adb and run it. That
      # command also runs the two Impeller suites, which we leave out.
      - name: 🧪 Run flutter_shell_native_unittests on the emulator
        if: matrix.suite == 'android'
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          cores: 4
          ram-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -no-metrics
          working-directory: engine/src
          script: |
            adb push out/${{ matrix.out_dir }}/flutter_shell_native_unittests /data/local/tmp/flutter_shell_native_unittests
            adb shell /data/local/tmp/flutter_shell_native_unittests
