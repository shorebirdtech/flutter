name: updater_integration_test
description: >-
  Drives shorebird_code_push's Dart API against the real Rust updater, through
  the library_test_hooks cdylib and a fake patch server.
publish_to: none

environment:
  # Test-only, so it needn't support old SDKs; 3.7 gives the formatter's
  # current style.
  sdk: ">=3.7.0 <4.0.0"

dependencies:
  ffi: ^2.0.2
  # The tests use the package's src/ internals, so they need its source, not
  # just its published API. It lives in shorebirdtech/shorebird.
  shorebird_code_push:
    git:
      url: https://github.com/shorebirdtech/shorebird.git
      ref: main
      path: packages/shorebird_code_push

dev_dependencies:
  # Regenerates test/generated/ from ffigen.yaml: dart run ffigen --config ffigen.yaml
  ffigen: ">=8.0.2 <23.0.0"
  shelf: ^1.4.0
  test: ^1.19.2
  very_good_analysis: ">=7.0.0 <12.0.0"
