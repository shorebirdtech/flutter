# Template for artifacts_manifest.yaml
# This file is processed by shard_runner:finalize
# Variable substitution: {{flutter_engine_revision}} is replaced at generation time
# The $engine placeholder is kept as-is for Shorebird's artifact proxy

flutter_engine_revision: {{flutter_engine_revision}}
storage_bucket: download.shorebird.dev
artifact_overrides:
  # Android release artifacts
  - flutter_infra_release/flutter/$engine/android-arm64-release/artifacts.zip
  - flutter_infra_release/flutter/$engine/android-arm64-release/darwin-x64.zip
  - flutter_infra_release/flutter/$engine/android-arm64-release/linux-x64.zip
  - flutter_infra_release/flutter/$engine/android-arm64-release/symbols.zip
  - flutter_infra_release/flutter/$engine/android-arm64-release/windows-x64.zip

  - flutter_infra_release/flutter/$engine/android-arm-release/artifacts.zip
  - flutter_infra_release/flutter/$engine/android-arm-release/darwin-x64.zip
  - flutter_infra_release/flutter/$engine/android-arm-release/linux-x64.zip
  - flutter_infra_release/flutter/$engine/android-arm-release/symbols.zip
  - flutter_infra_release/flutter/$engine/android-arm-release/windows-x64.zip

  - flutter_infra_release/flutter/$engine/android-x64-release/artifacts.zip
  - flutter_infra_release/flutter/$engine/android-x64-release/darwin-x64.zip
  - flutter_infra_release/flutter/$engine/android-x64-release/linux-x64.zip
  - flutter_infra_release/flutter/$engine/android-x64-release/symbols.zip
  - flutter_infra_release/flutter/$engine/android-x64-release/windows-x64.zip

  # Android debug and profile artifacts
  - flutter_infra_release/flutter/$engine/android-arm-profile/artifacts.zip
  - flutter_infra_release/flutter/$engine/android-arm-profile/darwin-x64.zip
  - flutter_infra_release/flutter/$engine/android-arm-profile/linux-x64.zip
  - flutter_infra_release/flutter/$engine/android-arm-profile/symbols.zip
  - flutter_infra_release/flutter/$engine/android-arm-profile/windows-x64.zip
  - flutter_infra_release/flutter/$engine/android-arm/artifacts.zip
  - flutter_infra_release/flutter/$engine/android-arm/symbols.zip
  - flutter_infra_release/flutter/$engine/android-arm64-profile/artifacts.zip
  - flutter_infra_release/flutter/$engine/android-arm64-profile/darwin-x64.zip
  - flutter_infra_release/flutter/$engine/android-arm64-profile/linux-x64.zip
  - flutter_infra_release/flutter/$engine/android-arm64-profile/symbols.zip
  - flutter_infra_release/flutter/$engine/android-arm64-profile/windows-x64.zip
  - flutter_infra_release/flutter/$engine/android-arm64/artifacts.zip
  - flutter_infra_release/flutter/$engine/android-arm64/symbols.zip
  - flutter_infra_release/flutter/$engine/android-x64-profile/artifacts.zip
  - flutter_infra_release/flutter/$engine/android-x64-profile/darwin-x64.zip
  - flutter_infra_release/flutter/$engine/android-x64-profile/linux-x64.zip
  - flutter_infra_release/flutter/$engine/android-x64-profile/symbols.zip
  - flutter_infra_release/flutter/$engine/android-x64-profile/windows-x64.zip
  - flutter_infra_release/flutter/$engine/android-x64/artifacts.zip
  - flutter_infra_release/flutter/$engine/android-x64/symbols.zip

  # Android debug and profile Maven artifacts
  - download.flutter.io/io/flutter/arm64_v8a_debug/1.0.0-$engine/arm64_v8a_debug-1.0.0-$engine.pom
  - download.flutter.io/io/flutter/arm64_v8a_debug/1.0.0-$engine/arm64_v8a_debug-1.0.0-$engine.jar
  - download.flutter.io/io/flutter/arm64_v8a_profile/1.0.0-$engine/arm64_v8a_profile-1.0.0-$engine.pom
  - download.flutter.io/io/flutter/arm64_v8a_profile/1.0.0-$engine/arm64_v8a_profile-1.0.0-$engine.jar
  - download.flutter.io/io/flutter/armeabi_v7a_debug/1.0.0-$engine/armeabi_v7a_debug-1.0.0-$engine.pom
  - download.flutter.io/io/flutter/armeabi_v7a_debug/1.0.0-$engine/armeabi_v7a_debug-1.0.0-$engine.jar
  - download.flutter.io/io/flutter/armeabi_v7a_profile/1.0.0-$engine/armeabi_v7a_profile-1.0.0-$engine.pom
  - download.flutter.io/io/flutter/armeabi_v7a_profile/1.0.0-$engine/armeabi_v7a_profile-1.0.0-$engine.jar
  - download.flutter.io/io/flutter/flutter_embedding_debug/1.0.0-$engine/flutter_embedding_debug-1.0.0-$engine.pom
  - download.flutter.io/io/flutter/flutter_embedding_debug/1.0.0-$engine/flutter_embedding_debug-1.0.0-$engine.jar
  - download.flutter.io/io/flutter/flutter_embedding_profile/1.0.0-$engine/flutter_embedding_profile-1.0.0-$engine.pom
  - download.flutter.io/io/flutter/flutter_embedding_profile/1.0.0-$engine/flutter_embedding_profile-1.0.0-$engine.jar
  - download.flutter.io/io/flutter/x86_64_debug/1.0.0-$engine/x86_64_debug-1.0.0-$engine.pom
  - download.flutter.io/io/flutter/x86_64_debug/1.0.0-$engine/x86_64_debug-1.0.0-$engine.jar
  - download.flutter.io/io/flutter/x86_64_profile/1.0.0-$engine/x86_64_profile-1.0.0-$engine.pom
  - download.flutter.io/io/flutter/x86_64_profile/1.0.0-$engine/x86_64_profile-1.0.0-$engine.jar

  # Dart and Flutter GPU packages (flutter_tools unpacks them into bin/cache/pkg)
  - flutter_infra_release/flutter/$engine/sky_engine.zip
  - flutter_infra_release/flutter/$engine/flutter_gpu.zip

  # engine_stamp.json
  - flutter_infra_release/flutter/$engine/engine_stamp.json

  # Dart SDK
  - flutter_infra_release/flutter/$engine/dart-sdk-darwin-arm64.zip
  - flutter_infra_release/flutter/$engine/dart-sdk-darwin-x64.zip
  - flutter_infra_release/flutter/$engine/dart-sdk-linux-x64.zip
  - flutter_infra_release/flutter/$engine/dart-sdk-windows-x64.zip

  # Maven artifacts
  - download.flutter.io/io/flutter/flutter_embedding_release/1.0.0-$engine/flutter_embedding_release-1.0.0-$engine.pom
  - download.flutter.io/io/flutter/flutter_embedding_release/1.0.0-$engine/flutter_embedding_release-1.0.0-$engine.jar
  - download.flutter.io/io/flutter/arm64_v8a_release/1.0.0-$engine/arm64_v8a_release-1.0.0-$engine.pom
  - download.flutter.io/io/flutter/arm64_v8a_release/1.0.0-$engine/arm64_v8a_release-1.0.0-$engine.jar
  - download.flutter.io/io/flutter/armeabi_v7a_release/1.0.0-$engine/armeabi_v7a_release-1.0.0-$engine.pom
  - download.flutter.io/io/flutter/armeabi_v7a_release/1.0.0-$engine/armeabi_v7a_release-1.0.0-$engine.jar
  - download.flutter.io/io/flutter/x86_64_release/1.0.0-$engine/x86_64_release-1.0.0-$engine.pom
  - download.flutter.io/io/flutter/x86_64_release/1.0.0-$engine/x86_64_release-1.0.0-$engine.jar

  # Common artifacts
  - flutter_infra_release/flutter/$engine/flutter_patched_sdk.zip
  - flutter_infra_release/flutter/$engine/flutter_patched_sdk_product.zip

  # Web artifacts
  - flutter_infra_release/flutter/$engine/flutter-web-sdk.zip

  # iOS profile artifacts. ios/artifacts.zip (debug) is built and staged but
  # still served from upstream. The fork's debug engine has no simulator
  # (dart_force_simulator=false), so on iOS 26+ it can JIT only with
  # Flutter's lldb helper attached (flutter run); an Xcode run without it
  # aborts with "Unable to JIT", where upstream's engine falls back to its
  # simulator. Serve it once the fork's ios_debug builds with
  # dart_force_simulator=true, as upstream's tools/gn does, and a debug run
  # with FFI callbacks passes on an iOS 26+ device.
  - flutter_infra_release/flutter/$engine/ios-profile/artifacts.zip

  # iOS release artifacts
  - flutter_infra_release/flutter/$engine/ios-release/artifacts.zip
  - flutter_infra_release/flutter/$engine/ios-release/Flutter.framework.dSYM.zip

  # Linux debug and profile artifacts
  - flutter_infra_release/flutter/$engine/linux-x64-debug/linux-x64-flutter-gtk.zip
  - flutter_infra_release/flutter/$engine/linux-x64-profile/linux-x64-flutter-gtk.zip

  # Linux release artifacts
  - flutter_infra_release/flutter/$engine/linux-x64/artifacts.zip
  - flutter_infra_release/flutter/$engine/linux-x64-release/linux-x64-flutter-gtk.zip

  # macOS debug and profile artifacts
  - flutter_infra_release/flutter/$engine/darwin-arm64/artifacts.zip
  - flutter_infra_release/flutter/$engine/darwin-arm64-profile/artifacts.zip
  - flutter_infra_release/flutter/$engine/darwin-x64/artifacts.zip
  - flutter_infra_release/flutter/$engine/darwin-x64/framework.zip
  - flutter_infra_release/flutter/$engine/darwin-x64/gen_snapshot.zip
  - flutter_infra_release/flutter/$engine/darwin-x64-profile/artifacts.zip
  - flutter_infra_release/flutter/$engine/darwin-x64-profile/framework.zip
  - flutter_infra_release/flutter/$engine/darwin-x64-profile/gen_snapshot.zip

  # macOS release artifacts
  - flutter_infra_release/flutter/$engine/darwin-x64-release/artifacts.zip
  - flutter_infra_release/flutter/$engine/darwin-x64-release/framework.zip
  - flutter_infra_release/flutter/$engine/darwin-x64-release/gen_snapshot.zip
  # const_finder.dart.snapshot is a kernel the arm64 host dart-sdk (a strict,
  # sdk-hash-verifying prebuilt) loads during icon tree shaking, so it must be
  # built against that same Dart, not proxied from upstream.
  - flutter_infra_release/flutter/$engine/darwin-arm64/font-subset.zip

  # Windows debug and profile artifacts
  - flutter_infra_release/flutter/$engine/windows-x64/flutter-cpp-client-wrapper.zip
  - flutter_infra_release/flutter/$engine/windows-x64-debug/windows-x64-flutter.zip
  - flutter_infra_release/flutter/$engine/windows-x64-profile/windows-x64-flutter.zip

  # Windows release artifacts
  - flutter_infra_release/flutter/$engine/windows-x64/artifacts.zip
  - flutter_infra_release/flutter/$engine/windows-x64-release/windows-x64-flutter.zip
