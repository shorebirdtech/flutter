// Emits Chrome Trace Event Format events for every Gradle task so the
// flutter build trace (`flutter build ... --trace`) can show per-task
// timings alongside flutter tool + flutter assemble spans.
//
// Activated by passing `-I=<this>` together with
// `-Pflutter.gradle-trace-file=<path>`. Output file is consumed by
// Flutter's gradle.dart and merged into the main trace.
//
// Events land on tid=4 (flutter tool = 1, native build outer = 2, flutter
// assemble = 3) so Perfetto shows a clean per-tier layout.

import groovy.json.JsonOutput
import org.gradle.api.Task
import org.gradle.api.execution.TaskExecutionListener
import org.gradle.api.tasks.TaskState

def traceFilePath = gradle.startParameter.projectProperties['flutter.gradle-trace-file']
if (!traceFilePath) {
    traceFilePath = System.getProperty('flutter.gradle-trace-file')
}
if (!traceFilePath) {
    return
}

def events = Collections.synchronizedList([])
def startTimesMicros = Collections.synchronizedMap([:])

gradle.addListener(new TaskExecutionListener() {
    @Override
    void beforeExecute(Task task) {
        startTimesMicros[task.path] = System.currentTimeMillis() * 1000L
    }

    @Override
    void afterExecute(Task task, TaskState state) {
        def start = startTimesMicros.remove(task.path)
        if (start == null) return
        def end = System.currentTimeMillis() * 1000L
        def dur = Math.max(0L, end - start)
        // Classify the task path into a small set of "kinds" so downstream
        // summarizers can bucket without retaining names. Match against the
        // task's simple name (last colon segment) so plugin names like
        // `:package_info_plus:...` don't accidentally trigger the `packaging`
        // bucket.
        def path = task.path
        def lastColon = path.lastIndexOf(':')
        def simpleName = (lastColon >= 0 ? path.substring(lastColon + 1) : path).toLowerCase()
        def kind = 'other'
        if (simpleName.contains('kotlin') && simpleName.startsWith('compile')) kind = 'kotlin_compile'
        else if (simpleName.startsWith('compile') && (simpleName.contains('java') || simpleName.contains('jni'))) kind = 'java_compile'
        else if (simpleName.contains('aidl')) kind = 'aidl'
        else if (simpleName.contains('r8') || simpleName.startsWith('minify')) kind = 'r8_minify'
        else if (simpleName.contains('dex')) kind = 'dex'
        else if (simpleName.startsWith('lint')) kind = 'lint'
        else if (simpleName.contains('link') && simpleName.contains('native')) kind = 'native_link'
        else if (simpleName.contains('processresources') || simpleName.contains('mergeresources') || simpleName.contains('mergemanifest')) kind = 'resources'
        else if (simpleName.startsWith('package') || simpleName.contains('packagerelease') || simpleName.contains('packagedebug')) kind = 'packaging'
        else if (simpleName.contains('bundle')) kind = 'bundle'
        else if (simpleName.contains('transform')) kind = 'transform'
        else if (simpleName.startsWith('compileflutter') || simpleName.contains('flutterbuild') || simpleName.startsWith('flutter')) kind = 'flutter_gradle_plugin'

        // The task "owner" is the first colon-separated segment. For
        // subproject tasks this is typically the plugin name (e.g.
        // `:camera_android`). Kept for local debug — the privacy-safe
        // summary that Shorebird writes aggregates this out.
        def owner = path.startsWith(':') ? path.substring(1).split(':')[0] : ''

        events.add([
            name: path,
            cat: 'gradle_task',
            ph: 'X',
            ts: start,
            dur: dur,
            pid: 1,
            tid: 4,
            args: [
                kind: kind,
                owner: owner,
                skipped: state.skipped,
                upToDate: state.upToDate,
                fromCache: state.skipMessage == 'FROM-CACHE',
            ],
        ])
    }
})

gradle.buildFinished {
    def f = new File(traceFilePath)
    f.parentFile?.mkdirs()
    f.text = JsonOutput.toJson(events)
}
