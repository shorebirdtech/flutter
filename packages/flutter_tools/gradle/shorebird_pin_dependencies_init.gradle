// Forces the app's Maven dependencies to the versions its Shorebird release
// was built with, so a patch build resolves the same libraries as the
// release even when a dependency uses a dynamic version (`1.+`, a range) or
// a newer version was published since.
//
// This file is Shorebird-specific: it exists in the Shorebird fork of
// Flutter and has no equivalent upstream. flutter_tools passes it with `-I=`
// only when `-Pshorebird.pinned-dependencies=<path>` is set
// (lib/src/shorebird/shorebird_pinned_dependencies.dart). `<path>` lists one
// `group:artifact:version` per line; blank lines and lines starting with `#`
// are skipped.
//
// Only the application project's classpaths are pinned: its runtime
// classpaths (`releaseRuntimeClasspath` and the like) decide which libraries
// ship in the app, and its compile classpaths are what the app's own code
// compiled against, the same versions in the release. Plugin subprojects are left
// alone, because in the release each compiled against its own declared
// versions, not the app's; forcing the app's versions on them could change
// their compiled code with no source change. Test and tool classpaths (the
// Kotlin compiler's, lint's) are left alone too. `force` only changes the
// version of a module that is already in a graph; it never adds one.

def pinsPath = gradle.startParameter.projectProperties['shorebird.pinned-dependencies']
if (!pinsPath) {
    return
}

def pinsFile = new File(pinsPath)
if (!pinsFile.isFile()) {
    throw new GradleException(
            "Shorebird: the Maven versions to pin (shorebird.pinned-dependencies) are missing: $pinsPath")
}
def pins = pinsFile.readLines()
        .collect { it.trim() }
        .findAll { it && !it.startsWith('#') }
if (pins.isEmpty()) {
    return
}

gradle.allprojects { project ->
    project.plugins.withId('com.android.application') {
        project.configurations.configureEach { configuration ->
            def name = configuration.name
            if ((name.endsWith('RuntimeClasspath') ||
                    name.endsWith('CompileClasspath')) &&
                    !name.contains('UnitTest') &&
                    !name.contains('AndroidTest') &&
                    !name.startsWith('test')) {
                configuration.resolutionStrategy.force(*pins)
            }
        }
    }
}
